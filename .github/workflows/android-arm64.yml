name: Android arm64 build
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      # services.gradle.org redirects to the GitHub release asset, and both hosts
      # intermittently answer 504. Try several sources, but accept only bytes that
      # match the official SHA-256 of gradle-8.13-bin.zip.
      - name: Provision Gradle 8.13
        env:
          GRADLE_DIST_SHA256: 20f1b1176237254a6fc204d8434196fa11a4cfb387567519c61556e8710aed78
        run: |
          set -euo pipefail
          zip=/tmp/gradle-8.13-bin.zip
          ok=0
          for url in \
            "https://services.gradle.org/distributions/gradle-8.13-bin.zip" \
            "https://github.com/gradle/gradle-distributions/releases/download/v8.13.0/gradle-8.13-bin.zip" \
            "https://mirrors.cloud.tencent.com/gradle/gradle-8.13-bin.zip" \
            "https://mirrors.huaweicloud.com/gradle/gradle-8.13-bin.zip"; do
            echo "::group::Gradle distribution from ${url}"
            rm -f "${zip}"
            if curl -fsSL --retry 2 --retry-delay 3 --retry-all-errors --connect-timeout 20 -o "${zip}" "${url}"; then
              if echo "${GRADLE_DIST_SHA256}  ${zip}" | sha256sum -c -; then
                ok=1
                echo "::endgroup::"
                break
              fi
              echo "SHA-256 mismatch, discarding ${url}" >&2
            fi
            echo "::endgroup::"
          done
          if [ "${ok}" -ne 1 ]; then
            echo "::error::No source served gradle-8.13-bin.zip with the pinned SHA-256" >&2
            exit 1
          fi
          mkdir -p /opt/gradle
          unzip -q "${zip}" -d /opt/gradle
          echo "/opt/gradle/gradle-8.13/bin" >> "${GITHUB_PATH}"
          /opt/gradle/gradle-8.13/bin/gradle --version
      - name: Cache Gradle user home
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-home-${{ runner.os }}-8.13-${{ hashFiles('**/*.gradle.kts', 'gradle.properties') }}
          restore-keys: |
            gradle-home-${{ runner.os }}-8.13-
      - name: Repository contract and APK validator tests
        run: |
          python3 tools/check_repository.py
          python3 tools/test_apk_verifier.py
          python3 tools/release_gate.py
      - name: Domain contract tests and Android debug compile
        run: gradle --no-daemon :core:domain:smokeTest :app:assembleDebug
      - name: Android static lint
        run: gradle --no-daemon :app:lintDebug
      - name: Verify arm64-only native content
        run: python3 tools/verify_apk.py app/build/outputs/apk/debug/app-debug.apk
      - name: Verify APK debug signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
      - name: Publish debug artifact
        uses: actions/upload-artifact@v6
        with:
          name: tailg-client-arm64-v8a-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error